---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: send-grid-mailing-service
  namespace: api-manager
  labels:
    app.kubernetes.io/name: send-grid-mailing-service
    app: send-grid-mailing-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: send-grid-mailing-service
  template:
    metadata:
      labels:
        app: send-grid-mailing-service
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - send-grid-mailing-service
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: send-grid-mailing-service
          image: 192.168.124.184:8085/api-manager/send-grid-mailing-service:staging
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-manager-common
          command: ["java"]
          args:
            - "-XX:MinHeapFreeRatio=20"
            - "-XX:MaxHeapFreeRatio=40"
            - "-Djava.awt.headless=true"
            - "-XX:+UseContainerSupport"
            - "-jar"
            - "app.jar"
            - "--server.port=8080"
            - "--spring.profiles.active=staging"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # startupProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8080
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          #   failureThreshold: 30
          # livenessProbe: 
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8080
          #   initialDelaySeconds: 60
          #   periodSeconds: 10
          #   failureThreshold: 3
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health/readiness
          #     port: 8080
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          #   failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: send-grid-mailing-service
  namespace: api-manager
  labels:
    app: send-grid-mailing-service
spec:
  type: ClusterIP
  selector:
    app: send-grid-mailing-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: send-grid-mailing-service
  namespace: api-manager
  labels:
    app: send-grid-mailing-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: send-grid-mailing-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: send-grid-mailing-service
  namespace: api-manager
  labels:
    app: send-grid-mailing-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: send-grid-mailing-service
