---
# 1) Operator + CRDs. Installed first (cluster-wide controller, own namespace).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-operator-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # manual sync: sync this Application BEFORE redis-staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  source:
    repoURL: https://ot-container-kit.github.io/helm-charts/
    chart: redis-operator
    targetRevision: 0.24.0               # verify latest: helm search repo ot-helm/redis-operator
    helm:
      releaseName: redis-operator
      valuesObject:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits:   {cpu: 200m, memory: 256Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-operator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true             # CRDs are large; avoids annotation-size errors
      - PruneLast=true


---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging
  sources:
    - repoURL: https://ot-container-kit.github.io/helm-charts/
      chart: redis-replication
      targetRevision: 0.17.1             # >= 0.17.0 required for embedded Sentinel
      helm:
        releaseName: redis
        valueFiles:
          - $values/shared/helm/redis/values-common.yaml
          - $values/staging/helm/redis/values.yaml
    - repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
  ignoreDifferences:                     # operator mutates status; avoids perpetual OutOfSync
    - group: redis.redis.opstreelabs.in
      kind: RedisReplication
      jqPathExpressions:
        - .status

