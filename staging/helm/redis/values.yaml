# Staging overrides: sized for small nodes (maxmemory must stay under the memory limit).
# externalConfig.data is a string, so it replaces the shared one: keep it complete.
externalConfig:
  enabled: true
  data: |
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 256mb
    maxmemory-policy noeviction

redisReplication:
  resources:
    requests: {cpu: 50m,  memory: 128Mi}
    limits:   {cpu: 500m, memory: 512Mi}

sentinel:
  resources:
    requests: {cpu: 25m,  memory: 32Mi}
    limits:   {cpu: 100m, memory: 64Mi}
