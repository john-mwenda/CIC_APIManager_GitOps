# Staging overrides: sized for 12 GB worker nodes (one Redis + one Sentinel per node).
# externalConfig.data is a string, so it replaces the shared one: keep it complete.
externalConfig:
  enabled: true
  data: |
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 1gb
    maxmemory-policy noeviction

redisReplication:
  resources:
    requests: {cpu: 250m, memory: 2Gi}
    limits:   {memory: 2Gi}          # no CPU limit: avoids throttling during saves/rewrites

sentinel:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits:   {memory: 128Mi}        # no CPU limit: avoids delayed health checks

redisExporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits:   {cpu: 100m, memory: 64Mi}

storageSpec:
  volumeClaimTemplate:
    spec:
      storageClassName: longhorn-1
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 8Gi