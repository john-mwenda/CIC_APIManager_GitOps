defaultSettings:
  # Lower than chart default (12%) so instance managers reserve less CPU on small nodes.
  guaranteedInstanceManagerCPU: '{"v1":"12","v2":"12"}'
longhornManager:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
longhornGlobalManager:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
service:
  ui:
    type: LoadBalancer
    loadBalancerIP: 192.168.124.225
preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: true