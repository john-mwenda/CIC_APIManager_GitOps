# OpsTree redis-replication chart (0.17.x) + redis-operator. Open-source images from quay.io
# (anonymously pullable: no registry secret needed). Pin exact tags; do not use "latest".
#
# The RedisReplication resource is named after the Helm release ("redis"), which gives:
#   Redis StatefulSet   redis      (pods redis-0..2, label app=redis)
#   Sentinel StatefulSet redis-s   (pods redis-s-0..2, label app=redis-s)
#   Service  redis-master          -> current primary (writes)
#   Service  redis-s-hl            -> Sentinels, port 26379, master name "mymaster"
redisReplication:
  clusterSize: 3
  image: quay.io/opstree/redis
  tag: v7.2.13
  imagePullPolicy: IfNotPresent
  redisSecret:
    secretName: redis            # existing Secret
    secretKey: redis-password

# AOF + RDB baseline. Per-environment values add "maxmemory".
externalConfig:
  enabled: true
  data: |
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    save 900 1
    save 300 10
    save 60 10000
    maxmemory-policy noeviction

# Embedded Sentinel (disabled by default in the chart, so it must be enabled here).
# The embedded Sentinel always monitors the group "mymaster"; quorum defaults to 2.
# The chart has no masterGroupName/quorum keys, so they are not set here.
sentinel:
  enabled: true
  size: 3
  image: quay.io/opstree/redis-sentinel
  tag: v7.2.13
  imagePullPolicy: IfNotPresent
  downAfterMilliseconds: "5000"
  failoverTimeout: "10000"
  parallelSyncs: "1"
  # One Sentinel per node
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: redis-s

redisExporter:
  enabled: true
  image: quay.io/opstree/redis-exporter
  tag: v1.44.0

# One Redis pod per node (label app = RedisReplication name = Helm release name "redis")
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app: redis

storageSpec:
  volumeClaimTemplate:
    spec:
      storageClassName: longhorn-1
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi

# Chart default is minAvailable: 1; it must be nulled or both fields are rendered.
pdb:
  enabled: true
  minAvailable: null
  maxUnavailable: 1
