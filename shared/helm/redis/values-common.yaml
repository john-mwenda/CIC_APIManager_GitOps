architecture: replication

# Chart 28.3.10 defaults many Bitnami tags to "latest". Pin every image used by
# this release (and helpers) so Argo syncs stay reproducible.
image:
  registry: registry-1.docker.io
  repository: bitnami/redis
  tag: "8.10.3"

auth:
  enabled: true
  existingSecret: redis
  existingSecretPasswordKey: redis-password

# AOF + RDB baseline. maxmemory and container resources are per-environment.
commonConfiguration: |-
  appendonly yes
  appendfsync everysec
  auto-aof-rewrite-percentage 100
  auto-aof-rewrite-min-size 64mb
  save 900 1
  save 300 10
  save 60 10000
  maxmemory-policy noeviction

sentinel:
  enabled: true
  image:
    registry: registry-1.docker.io
    repository: bitnami/redis-sentinel
    tag: "8.10.3"

# Chart annotations for 28.3.10 list these helper versions (values default to latest).
kubectl:
  image:
    registry: registry-1.docker.io
    repository: bitnami/kubectl
    tag: "1.37.1"

volumePermissions:
  image:
    registry: registry-1.docker.io
    repository: bitnami/os-shell
    tag: "5"

sysctl:
  image:
    registry: registry-1.docker.io
    repository: bitnami/os-shell
    tag: "5"

metrics:
  image:
    registry: registry-1.docker.io
    repository: bitnami/redis-exporter
    tag: "1.96.0"

# With sentinel.enabled, Bitnami deploys one StatefulSet of this many nodes
# (each pod runs Redis + Sentinel). The master: section is not used.
replica:
  replicaCount: 3
  podAntiAffinityPreset: hard
  persistence:
    enabled: true
    storageClass: longhorn-1
    size: 10Gi
  pdb:
    create: true
    maxUnavailable: 1
