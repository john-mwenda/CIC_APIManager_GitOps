image:
  registry: docker.io
  repository: grafana/alloy
  tag: v1.22.0

controller:
  type: daemonset
  tolerations:
    - operator: Exists
  volumes:
    extra:
      - name: alloy-data
        hostPath:
          path: /data/alloy
          type: DirectoryOrCreate

crds:
  create: false

alloy:
  storagePath: /data/alloy      # positions file, survives pod restarts
  mounts:
    varlog: true                   # mounts host /var/log (includes /var/log/pods)
    extra:
      - name: alloy-data
        mountPath: /data/alloy
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { memory: 512Mi }
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Discovery is used only for metadata and path building (local node only)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        // /var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Parse containerd/CRI log format (use stage.docker {} for Docker runtime)
      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
        external_labels = {
          cluster = "my-cluster",
        }
      }