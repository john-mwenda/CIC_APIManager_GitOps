grafana:
  admin:
    existingSecret: prometheus-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  enabled: true
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: "13.3.1-distroless"
  # Sidecar used for dashboards/datasources provisioning.
  sidecar:
    image:
      registry: quay.io
      repository: kiwigrid/k8s-sidecar
      tag: "2.14.3"
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  service:
    type: NodePort
    nodePort: 30080
  grafana.ini:
    smtp:
      enabled: true
      host: smtp.gmail.com:587
      from_address: jmwenda56@gmail.com
      from_name: John Mwenda
      starttls_policy: MandatoryStartTLS
  smtp:
    existingSecret: prometheus-grafana-smtp
    userKey: user
    passwordKey: password

prometheusOperator:
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: "v0.95.2"
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: "v0.95.2"
  admissionWebhooks:
    patch:
      image:
        registry: ghcr.io
        repository: jkroepke/kube-webhook-certgen
        tag: "1.11.1"

prometheus:
  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: "v3.16.0-distroless"
    containers:
    - name: prometheus
      startupProbe:
        failureThreshold: 300
        periodSeconds: 15
    replicas: 1
    retention: 30d
    retentionSize: 20GiB
    evaluationInterval: 30s
    walCompression: true
    podAntiAffinity: soft
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 30Gi

alertmanager:
  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: "v0.35.0"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-2
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

kube-state-metrics:
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: "v2.20.0"

prometheus-node-exporter:
  image:
    registry: quay.io
    repository: prometheus/node-exporter
    # Chart appends "-distroless" when image.distroless is true (default).
    tag: "v1.12.1"
