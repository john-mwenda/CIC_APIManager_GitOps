# SimpleScalable Loki with platform MinIO for chunk/index object storage.
# Clients should send logs/queries to the gateway Service.
# Container resources are set per environment.
deploymentMode: SimpleScalable

# Chart 21.2.3 no longer exposes a root `minio:` values key. Use the platform
# MinIO Service endpoint in loki.storage.s3 (do not deploy a chart-bundled MinIO).

loki:
  auth_enabled: false
  # Pin to chart 21.2.3 appVersion (do not leave tag null / floating).
  image:
    registry: docker.io
    repository: grafana/loki
    tag: "3.7.10"
  commonConfig:
    # Must be <= write.replicas
    replication_factor: 3
  limits_config:
    max_query_length: 721h
    retention_period: 30d
  compactor:
    retention_enabled: true
    delete_request_store: s3
  schemaConfig:
    configs:
      - from: "2024-01-01"
        index:
          period: 24h
          prefix: index_
        object_store: s3
        schema: v13
        store: tsdb
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      s3ForcePathStyle: true
      insecure: true

# Credentials Secret (create outside Git in namespace monitoring):
# kubectl -n monitoring create secret generic loki-minio-credentials \
#   --from-literal=AWS_ACCESS_KEY_ID='...' \
#   --from-literal=AWS_SECRET_ACCESS_KEY='...'
write:
  replicas: 3
  extraEnvFrom:
    - secretRef:
        name: loki-minio-credentials
  # WAL only; chunks live in MinIO. Single Longhorn replica is enough
  # because write RF=2 covers pod failure and MinIO stores durable chunks.
  persistence:
    enabled: true
    size: 5Gi
    storageClass: longhorn-2

read:
  replicas: 2
  extraEnvFrom:
    - secretRef:
        name: loki-minio-credentials

backend:
  replicas: 2
  extraEnvFrom:
    - secretRef:
        name: loki-minio-credentials
  persistence:
    enabled: true
    size: 5Gi
    storageClass: longhorn-2

gateway:
  enabled: true
  replicas: 2
  image:
    registry: docker.io
    repository: nginx/nginx-unprivileged
    tag: "1.31-alpine"
  metrics:
    image:
      registry: ghcr.io
      repository: jkroepke/access-log-exporter
      tag: "1.0.2"

sidecar:
  image:
    registry: docker.io
    repository: kiwigrid/k8s-sidecar
    tag: "2.14.3"

# Disable SingleBinary and unused distributed targets
singleBinary:
  replicas: 0
  persistence:
    enabled: false

chunksCache:
  enabled: false
compactor:
  replicas: 0
distributor:
  replicas: 0
indexGateway:
  replicas: 0
ingester:
  replicas: 0
lokiCanary:
  enabled: false
  image:
    registry: docker.io
    repository: grafana/loki-canary
    tag: "3.7.10"
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
resultsCache:
  enabled: false
ruler:
  replicas: 0
# Chart default test image tag is "latest"; keep tests off.
test:
  enabled: false

