# Chart name is `silo`. These overrides keep the Service at
# minio.minio.svc.cluster.local and the StatefulSet name `minio`, so existing
# PVCs stay bound and Loki does not need a new endpoint.
nameOverride: minio
fullnameOverride: minio
serviceAccount:
  create: true
  name: minio-sa

mode: distributed
replicas: 6
pools: 1
drivesPerNode: 1

image:
  repository: docker.io/pgsty/silo
  tag: RELEASE.2026-11-12T00-00-00Z
  pullPolicy: IfNotPresent

# Chart bucket/user jobs call `mc`. The standard Silo image ships that client
# and a shell, so the jobs use the same registry and tag as the server.
mcImage:
  repository: docker.io/pgsty/mc
  tag: RELEASE.2026-11-12T00-00-00Z

existingSecret: minio-auth

persistence:
  enabled: true
  storageClass: minio-local
  accessMode: ReadWriteOnce
  size: 100Gi

environment:
  MINIO_STORAGE_CLASS_STANDARD: "EC:2"

# Schedule only on nodes labelled for MinIO, including labelled control-plane nodes.
# Example: kubectl label node <node> workload.cic.io/minio=true
nodeSelector:
  workload.cic.io/minio: "true"

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1                    # prevents node drains from taking out more than one pod

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - minio
        topologyKey: kubernetes.io/hostname


# Dedicated Loki user instead of root credentials (see note 2)
users:
  - accessKey: loki
    existingSecret: loki-minio-credentials
    existingSecretKey: AWS_SECRET_ACCESS_KEY
    policy: loki-rw

policies:
  - name: loki-rw
    statements:
      - effect: Allow
        resources:
          - "arn:aws:s3:::loki-chunks"
          - "arn:aws:s3:::loki-chunks/*"
          - "arn:aws:s3:::loki-ruler"
          - "arn:aws:s3:::loki-ruler/*"
        actions:
          - "s3:*"

securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

service:
  type: ClusterIP

consoleService:
  type: LoadBalancer

buckets:
  - name: loki-chunks
    policy: none
    purge: false
  - name: loki-ruler
    policy: none
    purge: false
  - name: loki-admin
    policy: none
    purge: false

metrics:
  serviceMonitor:
    enabled: true
    includeNode: true
    labels:
      release: prometheus
