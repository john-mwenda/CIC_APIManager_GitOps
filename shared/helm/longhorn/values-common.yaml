# kubeadm taints control planes with NoSchedule. The chart tolerates nothing
# by default, so Longhorn stays off those nodes until both of these are set:
# global.tolerations for the manager, UI, and driver, and taintToleration for
# the instance manager, CSI plugin, and engine image.
global:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
defaultSettings:
  defaultReplicaCount: 3
  defaultDataPath: /data/longhorn
  storageMinimalAvailablePercentage: 25
  backupTarget: ""
  # Empty taint value matches kubeadm (key=:NoSchedule).
  taintToleration: "node-role.kubernetes.io/control-plane=:NoSchedule;node-role.kubernetes.io/master=:NoSchedule"
  # Create /data/longhorn only on nodes labeled node.longhorn.io/create-default-disk=true.
  createDefaultDiskLabeledNodes: true
# Pin every Longhorn / CSI image to the 1.13.0 chart defaults (no floating tags).
image:
  longhorn:
    engine:
      repository: longhornio/longhorn-engine
      tag: v1.13.0
    manager:
      repository: longhornio/longhorn-manager
      tag: v1.13.0
    ui:
      repository: longhornio/longhorn-ui
      tag: v1.13.0
    instanceManager:
      repository: longhornio/longhorn-instance-manager
      tag: v1.13.0
    shareManager:
      repository: longhornio/longhorn-share-manager
      tag: v1.13.0
    backingImageManager:
      repository: longhornio/backing-image-manager
      tag: v1.13.0
    supportBundleKit:
      repository: longhornio/support-bundle-kit
      tag: v0.0.98
  csi:
    attacher:
      repository: longhornio/csi-attacher
      tag: v4.13.0
    provisioner:
      repository: longhornio/csi-provisioner
      tag: v6.3.0
    nodeDriverRegistrar:
      repository: longhornio/csi-node-driver-registrar
      tag: v2.18.0
    resizer:
      repository: longhornio/csi-resizer
      tag: v2.2.1
    snapshotter:
      repository: longhornio/csi-snapshotter
      tag: v8.6.0
    livenessProbe:
      repository: longhornio/livenessprobe
      tag: v2.20.0
service:
  ui:
    type: LoadBalancer
