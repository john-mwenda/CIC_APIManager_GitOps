---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-manager-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads-production
  source:
    repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
    targetRevision: master
    path: manifests/api-manager/production
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: api-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

