---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring-production
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 67.9.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/helm/kube-prometheus-stack/values-common.yaml
          - $values/helm/kube-prometheus-stack/values-production.yaml
    - repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true

