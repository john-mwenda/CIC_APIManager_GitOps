---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-manager-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads-staging
  source:
    repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
    targetRevision: main
    path: manifests/api-manager/staging
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: api-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

