apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-portal-ingress
  namespace: external-portal
spec:
  ingressClassName: nginx
  tls:
    - hosts: [external-portal.cic.co.ke]
      secretName: api-manager-external-tls
  rules:
    - host: external-portal.cic.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: external-portal-middleware-service
                port:
                  number: 8080
