apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cic-staging-platform-root
  namespace: argocd
spec:
  project: bootstrap-staging
  source:
    repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
    targetRevision: master
    path: applications/staging/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

