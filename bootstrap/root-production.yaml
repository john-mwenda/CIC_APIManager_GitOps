apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cic-production-platform-root
  namespace: argocd
spec:
  project: bootstrap-production
  source:
    repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
    targetRevision: master
    path: applications/production/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

