apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cic-production-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
    targetRevision: master
    path: applications/production
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
