---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring-production
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.2.2
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/shared/helm/kube-prometheus-stack/values-common.yaml
          - $values/production/helm/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring-production
  sources:
    # Loki 21.x is published on the Grafana Community OCI registry (not grafana.github.io).
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: loki
      targetRevision: 21.2.3
      helm:
        releaseName: loki
        valueFiles:
          - $values/shared/helm/loki/values-common.yaml
          - $values/production/helm/loki/values.yaml
    - repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true

