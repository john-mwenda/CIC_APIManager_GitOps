---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-production
  sources:
    - repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
      targetRevision: master
      path: production/manifests/storageclasses
      directory:
        recurse: true
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/shared/helm/longhorn/values-common.yaml
          - $values/production/helm/longhorn/values.yaml
    - repoURL: https://github.com/john-mwenda/CIC_APIManager_GitOps.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true

