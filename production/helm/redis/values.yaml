# Sized for production nodes (maxmemory must fit under the memory limit).
# externalConfig.data is a string, so it replaces the shared one: keep it complete.
externalConfig:
  enabled: true
  data: |
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 700mb
    maxmemory-policy noeviction

redisReplication:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

sentinel:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
