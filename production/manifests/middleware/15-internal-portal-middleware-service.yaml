apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-portal-middleware-service
  namespace: middleware
  labels:
    app.kubernetes.io/name: internal-portal-middleware-service
    app: internal-portal-middleware-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-portal-middleware-service
  template:
    metadata:
      labels:
        app: internal-portal-middleware-service
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - internal-portal-middleware-service
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: internal-portal-middleware-service
          image: 192.168.122.31:8085/api-manager/internal-portal:v1.0.3
          imagePullPolicy: Always
          # securityContext:
          #   allowPrivilegeEscalation: false
          #   readOnlyRootFilesystem: false
          #   runAsNonRoot: true
          #   runAsUser: 10001
          #   capabilities:
          #     drop:
          #       - ALL
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: internal-portal-middleware-service
  namespace: middleware
  labels:
    app: internal-portal-middleware-service
spec:
  type: ClusterIP
  selector:
    app: internal-portal-middleware-service
  ports:
    - name: http
      port: 8080
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: internal-portal-middleware-service
  namespace: middleware
  labels:
    app: internal-portal-middleware-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: internal-portal-middleware-service
  minreplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: internal-portal-middleware-service
  namespace: middleware
  labels:
    app: internal-portal-middleware-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: internal-portal-middleware-service