# Replace kubernetes.io/hostname values with the four MinIO worker node names.
# Each node must have a dedicated SSD mounted at /data/minio (XFS preferred),
# owned for MinIO UID/GID 1000, and empty before first deploy.
# Adjust capacity to the usable size of that filesystem.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-local-production-01
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: local-storage
    environment: staging
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  volumeMode: Filesystem
  local:
    path: /data/minio
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - api-managerprd-master-01
