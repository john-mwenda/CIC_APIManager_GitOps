grafana:
  adminPassword: CIC@Monitor2026
  enabled: true
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  service:
    type: NodePort
    nodePort: 30080
prometheus:
  prometheusSpec:
    containers:
    - name: prometheus
      startupProbe:
        failureThreshold: 300
        periodSeconds: 15
    nodeSelector:
      kubernetes.io/hostname: api-manager-master-04
    replicas: 2
    retention: 30d
    retentionSize: 100Gi
    evaluationInterval: 30s
    walCompression: true
    podAntiAffinity: hard
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 250m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
