grafana:
  adminPassword: CIC@Monitor2026
  enabled: true
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  service:
    type: NodePort
    nodePort: 30080
  grafana.ini:
    smtp:
      enabled: true
      host: smtp.gmail.com:587
      from_address: jmwenda56@gmail.com
      from_name: John Mwenda
      starttls_policy: MandatoryStartTLS
  smtp:
    existingSecret: prometheus-grafana-smtp
    userKey: user
    passwordKey: password

prometheus:
  prometheusSpec:
    containers:
    - name: prometheus
      startupProbe:
        failureThreshold: 300
        periodSeconds: 15
    nodeSelector:
      kubernetes.io/hostname: api-manager-master-04
    replicas: 1
    retention: 30d
    retentionSize: 100Gi
    evaluationInterval: 30s
    walCompression: true
    podAntiAffinity: soft
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 250m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 120Gi
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
